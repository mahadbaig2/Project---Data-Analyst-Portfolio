<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Delivery lifecycle and secured reporting</title>
  <desc id="description">Four service-level stages—network, mid-mile, arrival at destination and first attempt—feed role and zone-aware reporting.</desc>
  <rect width="1200" height="680" fill="#242424"/>
  <circle cx="1115" cy="-30" r="290" fill="none" stroke="#4b473b" stroke-width="1"/>
  <circle cx="1115" cy="-30" r="185" fill="none" stroke="#4b473b" stroke-width="1"/>
  <text x="72" y="100" fill="#f3bd35" font-size="17" font-family="Arial,sans-serif" letter-spacing="3">LOGISTICS BI</text>
  <text x="72" y="166" fill="#faf9f5" font-size="52" font-weight="700" font-family="Arial,sans-serif" letter-spacing="-2">One shipment. Four SLA signals.</text>
  <text x="72" y="205" fill="#b9b9b5" font-size="19" font-family="Arial,sans-serif">Each stage points to a different operational decision.</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="285" width="237" height="158" rx="16" fill="#353535" stroke="#55524b"/>
    <rect x="344" y="285" width="237" height="158" rx="16" fill="#353535" stroke="#55524b"/>
    <rect x="616" y="285" width="237" height="158" rx="16" fill="#353535" stroke="#55524b"/>
    <rect x="888" y="285" width="237" height="158" rx="16" fill="#353535" stroke="#55524b"/>
    <text x="94" y="326" fill="#f3bd35" font-size="16">01</text>
    <text x="366" y="326" fill="#f3bd35" font-size="16">02</text>
    <text x="638" y="326" fill="#f3bd35" font-size="16">03</text>
    <text x="910" y="326" fill="#f3bd35" font-size="16">04</text>
    <text x="94" y="380" fill="#faf9f5" font-size="27" font-weight="700">Network</text>
    <text x="366" y="380" fill="#faf9f5" font-size="27" font-weight="700">Mid-mile</text>
    <text x="638" y="370" fill="#faf9f5" font-size="25" font-weight="700">Arrival at</text>
    <text x="638" y="401" fill="#faf9f5" font-size="25" font-weight="700">destination</text>
    <text x="910" y="370" fill="#faf9f5" font-size="25" font-weight="700">First delivery</text>
    <text x="910" y="401" fill="#faf9f5" font-size="25" font-weight="700">attempt</text>
    <text x="315" y="383" fill="#f3bd35" font-size="30">→</text>
    <text x="587" y="383" fill="#f3bd35" font-size="30">→</text>
    <text x="859" y="383" fill="#f3bd35" font-size="30">→</text>
  </g>
  <rect x="72" y="511" width="1053" height="94" rx="16" fill="#f3bd35"/>
  <text x="97" y="552" fill="#242424" font-size="23" font-weight="700" font-family="Arial,sans-serif">Zone-aware access</text>
  <text x="97" y="580" fill="#3c321f" font-size="17" font-family="Arial,sans-serif">Regional managers see their own zone; executives can compare the network.</text>
  <text x="72" y="648" fill="#a9a9a4" font-size="14" font-family="Arial,sans-serif">Architecture diagram based on the project documentation</text>
</svg>
